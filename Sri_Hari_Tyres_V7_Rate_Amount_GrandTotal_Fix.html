function v2Escape(s){
  return String(s==null?"":s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function v2TestRow(id, module, scenario, status, detail){

    ${detail?`<div class="small" style="margin-top:3px">${v2Escape(detail)}</div>`:""}

}

function v2Check(condition, detail){
  return {status:condition?"PASS":"FAIL",detail:detail||""};
}

function v2RunSingleTest(tc){
  const src=document.documentElement.outerHTML;

        src.includes("AUTHORISED CEAT TYRES & SERVICE CENTRE") &&

        src.includes("6382212457"), "Exact shop header/address/phone found.");

    case "TC56":
      return v2Check(!src.includes("Payment Status"), "Payment Status is absent.");

        "TC36":["v2SendPDF","jsPDF"], "TC38":["r.items","qty","rate","amount"], "TC39":["Subtotal","Discount","Grand Total"],

function nextNo(){

  const nums=used.filter(x=>/^\d+$/.test(x)).map(Number);

  if(max<9999){
    let n=max+1;
    while(used.includes(String(n)) && n<=9999)n++;
    if(n<=9999)return String(n);
  }
  for(let i=1;i<=26*9999;i++){
    let q=i, label="";
    while(q>0){q--; label=String.fromCharCode(65+(q%26))+label; q=Math.floor(q/26);}
    if(!used.includes(label))return label;
  }
  return "A1";
}

 setTimeout(()=>{

   if(built){

    $('otherRows').appendChild(d);
   }
  });

function v3EditSave(){
 const id=S.editingId;
 const r=S.records.find(x=>String(x.id)===String(id));
 if(!r)return;
 const g=id=>$(id);
 const type=g('type')?.value||'';
 if((type==='Free Service'||type==='Wheel Alignment Service')&&(!g('date')?.value||!g('model')?.value||!g('vehicle')?.value||!g('km')?.value||!g('tech')?.value)){alert('Please complete all mandatory fields.');return}
 const mobile=g('mobile')?.value.trim()||'';
 if(mobile&&!/^[0-9 +()-]{8,15}$/.test(mobile)){alert('Please enter a valid mobile number.');return}

 // Read the values from the SAME V7 edit form that the user sees.
 // This includes built-in and custom service rows; never use the old #itemsBody selector.
 const items=[...document.querySelectorAll('#serviceRows .service-row,#otherRows .service-row')].map(row=>{
  const name=(row.dataset.service||row.querySelector('.service-name')?.textContent||'').trim();
  const qty=Number(row.querySelector('.qty')?.value||0);
  const rate=Number(row.querySelector('.rate')?.value||0);
  return {name,qty,rate,amount:qty*rate};
 }).filter(it=>it.name);

 const subtotal=items.reduce((sum,it)=>sum+Number(it.amount||0),0);
 const discount=Math.max(0,Number(g('discount')?.value||0));
 const total=Math.max(0,subtotal-discount);

 // Update the EXISTING object in S.records. Its original ID is preserved.
 // No push(), no new ID and no new service record is created.
 Object.assign(r,{
  no:r.no,
  date:g('date')?.value||'',
  customer:g('customer')?.value.trim()||'',
  mobile,
  vehicle:g('vehicle')?.value.trim().toUpperCase()||'',
  model:g('model')?.value.trim()||'',
  km:g('km')?.value||'',
  tech:g('tech')?.value||'',
  type,
  notes:g('notes')?.value.trim()||'',
  items,
  subtotal,
  discount,
  total
 });

 // Persist the modified existing record to local storage + the existing Firebase dataset.
 persist();
 const updatedId=r.id;
 delete S.editingId;
 alert('Service Record updated successfully.');
 S.page='history';
 render();
}

function v4ReminderState(r){

 if(r.dueKm&&cur>=Number(r.dueKm))return"overdue";
 if(r.dueDate){

   const d1=new Date(now),d2=new Date(r.dueDate),days=Math.ceil((d2-d1)/86400000);

}

function v8MonthKey(d){return String(d||'').slice(0,7)}
function v8MonthRecords(month){return (S.records||[]).filter(r=>v8MonthKey(r.date)===month)}
// Payment ledger normalization: support both new ledger records and older records
// that stored amountReceived/paymentMethod without the paymentRecorded flag.
function v8PaymentEntries(r){
 if(!r)return [];
 // Firebase Realtime Database can return an indexed payment list as an object
 // (especially after an item was deleted). Normalize both shapes before totaling.
 const raw=r.payments;
 const source=Array.isArray(raw)?raw:(raw&&typeof raw==='object'?Object.keys(raw).sort((a,b)=>Number(a)-Number(b)).map(k=>raw[k]):[]);
 const entries=source.filter(p=>p&&Number.isFinite(Number(p.amount))&&Number(p.amount)>0).map((p,i)=>({
   ...p,id:p.id||('PAY-NORMALIZED-'+String(r.id||r.no||'record')+'-'+i),
   amount:Math.round(Number(p.amount)*100)/100,
   date:p.date||r.paymentDate||r.date,
   method:p.method||r.paymentMethod||'Other'
 }));
 if(entries.length)return entries;
 // Older records have a single amountReceived field rather than a ledger.
 const legacy=Math.max(0,Number(r.amountReceived||0));
 if(legacy>0)return [{id:'LEGACY-'+String(r.id||r.no||'record'),date:r.paymentDate||r.date,method:r.paymentMethod&&r.paymentMethod!=='Pending - Not Paid'?r.paymentMethod:'Other',amount:Math.round(legacy*100)/100,reference:r.paymentReference||'',note:'Existing payment (legacy record)'}];
 return [];
}
function v8PaymentReceived(r){const cents=v8PaymentEntries(r).reduce((n,p)=>n+Math.round(Math.max(0,Number(p.amount||0))*100),0);return cents/100}
function v8PaymentState(r){
 if(!r)return 'Not Recorded';
 const entries=v8PaymentEntries(r),received=v8PaymentReceived(r),total=Math.max(0,Math.round(Number(r.total||0)*100)/100);
 if(!entries.length&&r.paymentRecorded!==true)return 'Not Recorded';
 if(received+0.01>=total)return 'Paid';
 return received>0?'Partially Paid':'Pending';
}
function v8ReceivedOnDate(date){return (S.records||[]).flatMap(r=>v8PaymentEntries(r).filter(p=>(p.date||r.date)===date).map(p=>({record:r,payment:p}))) }
function v8ReceivedInMonth(month){return (S.records||[]).reduce((n,r)=>n+v8PaymentEntries(r).filter(p=>String(p.date||r.date||'').slice(0,7)===month).reduce((x,p)=>x+Number(p.amount||0),0),0)}
function v8DateInput(id,value,onchange){return `<input id="${id}" type="date" value="${esc(value||'')}" ${onchange?`onchange="${onchange}"`:''}>`}
function v8MonthInput(id,value,onchange){return `<input id="${id}" type="month" value="${esc(value||'')}" ${onchange?`onchange="${onchange}"`:''}>`}
function dailyCollection(){

function v6FlushQueuedWrite(){
 if(!v6Db||!v6Ref||!sriHariUser)return;
 if(v6Writing){v6WriteQueued=true;return;}
 v6Writing=true;v6WriteQueued=false;
 const payload=JSON.parse(JSON.stringify(v6Payload()));

async function secureFirebaseStart(user){
 try{
  if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
  sriHariUser=user;window.sriHariUser=user;
  v6Db=firebase.database();
  v6Ref=v6Db.ref('sriHariTyres/appData');
  const snap=await v6Ref.once('value');
  const d=snap.val();
  if(d&&Array.isArray(d.records)){
   S.records=d.records||[];
   S.tech=Array.isArray(d.tech)&&d.tech.length?d.tech:S.tech;
   S.reminders=d.reminders||[];
   S.reminderStatus=d.reminderStatus||{};S.auditLog=Array.isArray(d.auditLog)?d.auditLog:(S.auditLog||[]);
   S.attendance=d.attendance||S.attendance||{};S.incentiveConfig=d.incentiveConfig||S.incentiveConfig;
   localStorage.setItem('sriHariV1',JSON.stringify(S));
  }else{
   await v6Ref.set(v6Payload());
  }
  if(!v6Listening){
   v6Listening=true;
   v6Ref.on('value',snap=>{
    if(v6Writing||!sriHariUser)return;
    const d=snap.val();
    if(!d||!Array.isArray(d.records))return;
    S.records=d.records||[];
    S.tech=Array.isArray(d.tech)&&d.tech.length?d.tech:S.tech;
    S.reminders=d.reminders||[];
    S.reminderStatus=d.reminderStatus||{};S.auditLog=Array.isArray(d.auditLog)?d.auditLog:(S.auditLog||[]);
    S.attendance=d.attendance||S.attendance||{};S.incentiveConfig=d.incentiveConfig||S.incentiveConfig;
    S.firebase.lastSync=new Date().toISOString();
    localStorage.setItem('sriHariV1',JSON.stringify(S));
    if(S.page!=='settings')render();
    v6SetStatus('Connected � Realtime sync active',true)
   })
  }
  S.firebase.enabled=true;S.firebase.connected=true;S.firebase.lastSync=new Date().toISOString();
  v6SetStatus('Connected � Realtime sync active',true);
  if(S.page!=='settings')render();
 }catch(e){
  S.firebase.connected=false;
  v6SetStatus('Database connection failed: '+(e.message||e));
  console.error(e);
 }
}

function secureFriendlyAuthError(e){
 const m=(e&&e.code)||"";
 const map={
  "auth/invalid-email":"Please enter a valid email address.",
  "auth/invalid-credential":"Email or password is incorrect.",
  "auth/user-disabled":"This account has been disabled.",
  "auth/too-many-requests":"Too many attempts. Please try again later.",
  "auth/network-request-failed":"Network error. Check your internet connection.",
  "auth/user-not-found":"Email or password is incorrect.",
  "auth/wrong-password":"Email or password is incorrect."
 };
 return map[m]||((e&&e.message)||"Sign-in failed.");
}
async function secureLogin(){
 const email=($("loginEmail")?.value||"").trim();
 const password=$("loginPassword")?.value||"";
 const err=$("authError"),btn=$("loginBtn");
 if(!email||!password){if(err)err.textContent="Enter your email and password.";return}
 if(btn){btn.disabled=true;btn.textContent="Signing in�"}
 if(err)err.textContent="";
 try{
  if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
  await firebase.auth().signInWithEmailAndPassword(email,password);
 }catch(e){
  if(err)err.textContent=secureFriendlyAuthError(e);
 }finally{
  if(btn){btn.disabled=false;btn.textContent="🔐 Sign In"}
 }
}
async function secureForgotPassword(){
 const email=($("loginEmail")?.value||"").trim();
 const err=$("authError");
 if(!email){if(err)err.textContent="Enter your email first.";return}
 try{
  if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
  await firebase.auth().sendPasswordResetEmail(email);
  if(err)err.textContent="Password reset email sent. Check your inbox.";
 }catch(e){if(err)err.textContent=secureFriendlyAuthError(e)}
}
