<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffd21a">
  <title>CEAT Service Management | Sri Hari Tyres</title>
  <link rel="stylesheet" href="style.css?v=v3">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="brand-mark">CEAT</div>
      <h1>CEAT SERVICE<br>MANAGEMENT</h1>
      <p class="login-brand">SRI HARI TYRES</p>
      <p class="login-sub">Authorised CEAT Tyres & Service Centre</p>
      <label>User ID / Email</label>
      <input id="loginEmail" type="email" autocomplete="username" placeholder="Enter user ID / email">
      <label>Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter password">
      <div id="loginError" class="error"></div>
      <button id="loginButton" class="primary wide">LOGIN</button>
    </div>
  </div>

  <div id="appShell" class="app-shell" hidden>
    <header class="topbar">
      <div>
        <div class="top-title">CEAT SERVICE MANAGEMENT</div>
        <div class="top-sub">SRI HARI TYRES • LIVE DATABASE</div>
      </div>
      <div class="top-actions">
        <span class="live"><i></i> LIVE</span>
        <button id="logoutButton" class="small-btn">Logout</button>
      </div>
    </header>

    <div class="app-layout">
      <aside class="sidebar">
        <button class="nav active" data-page="dashboard">📊 <span>Dashboard</span></button>
        <button class="nav" data-page="vehicles">🚗 <span>Vehicles</span></button>
        <button class="nav" data-page="record">🧾 <span>Service Record</span></button>
        <button class="nav" data-page="history">📋 <span>Service History</span></button>
        <button class="nav" data-page="reminders">🔔 <span>Reminders</span></button>
        <button class="nav" data-page="reports">📈 <span>Reports</span></button>
        <button class="nav" data-page="whatsapp">💬 <span>WhatsApp</span></button>
      </aside>
      <main id="mainContent"></main>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="printArea"></div>

  <script type="module" src="app.js?v=v3"></script>
</body>
</html>
