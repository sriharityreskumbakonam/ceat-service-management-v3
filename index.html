<script>
const firebaseConfig={apiKey:"AIzaSyCKWITST9Xl-RyS-K8WMHcgZ9xxyKfBmlo",authDomain:"ceat-service-management.firebaseapp.com",databaseURL:"https://ceat-service-management-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"ceat-service-management",storageBucket:"ceat-service-management.firebasestorage.app",messagingSenderId:"498531760991",appId:"1:498531760991:web:11818a77a9185ce316d4ea"};

function remove(r){return fetch(fbUrl(r.path||r),{method:"DELETE"}).then(async res=>{if(!res.ok)throw new Error(`Firebase HTTP ${res.status}: ${await res.text()}`);return true})}
function onValue(r,cb,errCb){let stopped=false;const read=async()=>{try{const res=await fetch(fbUrl(r.path||r),{cache:"no-store"});if(!res.ok)throw new Error(`Firebase HTTP ${res.status}`);const value=await res.json();if(!stopped)cb({val:()=>value});}catch(e){if(!stopped&&errCb)errCb(e)}};read();const timer=setInterval(read,5000);return()=>{stopped=true;clearInterval(timer)}}

const $=s=>document.querySelector(s), esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

const prettyDate=d=>d?new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"2-digit",year:"numeric"}):"—";
const normalizePhone=p=>String(p||"").replace(/\D/g,"").replace(/^0/,"").replace(/^91(?=\d{10}$)/,"");
function prefixValue(p){let n=0;for(const c of String(p||"")){n=n*26+(c.charCodeAt(0)-64)}return n}
function prefixFromValue(n){let s="";while(n>0){n--;s=String.fromCharCode(65+(n%26))+s;n=Math.floor(n/26)}return s}
function recordKey(v){const x=String(v||"").trim().toUpperCase();const m=x.match(/^(\d+)$/);if(m){const n=Number(m[1]);return {stage:0,prefix:0,num:n}}const a=x.match(/^([A-Z]+)(\d+)$/);if(a)return {stage:1,prefix:prefixValue(a[1]),num:Number(a[2])};return null}
function compareRecordKeys(a,b){return a.stage-b.stage||a.prefix-b.prefix||a.num-b.num}

const addMonths=(s,n)=>{const d=new Date(s+"T00:00:00"),day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()<day)d.setDate(0);return d.toISOString().slice(0,10)};

async function initFirebase(){
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),10000);
    const res=await fetch(fbUrl("serviceRecords"),{cache:"no-store",signal:controller.signal});
    clearTimeout(timer);
    if(!res.ok)throw new Error(`Firebase HTTP ${res.status}`);
    fbReady=true;
    const dbStatus=document.getElementById("dbStatus");
    if(dbStatus){dbStatus.textContent="● LIVE DATABASE CONNECTED";dbStatus.style.background="#123d2a";dbStatus.style.color="#7dffb0";}
    onValue(restRef("serviceRecords"),s=>{const v=s.val()||{};state.records=Object.entries(v).map(([id,r])=>({id,...r})).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.savedAt||"").localeCompare(a.savedAt||""));renderIfData()},e=>console.error("serviceRecords read failed",e));
    onValue(restRef("reminders"),s=>{const v=s.val()||{};state.reminders=Object.entries(v).map(([id,r])=>({id,...r})).filter(r=>r.status!=="sent"&&r.status!=="completed"&&r.status!=="cancelled").sort((a,b)=>(a.dueDate||"").localeCompare(b.dueDate||""));renderIfData()},e=>console.error("reminders read failed",e));
    renderIfData();
  }catch(err){
    fbReady=false;
    const reason=err?.name==="AbortError" ? "Firebase connection timed out (10s)." : (err?.message||"Unknown error");
    const dbStatus=document.getElementById("dbStatus");if(dbStatus){dbStatus.textContent="● DATABASE ERROR";dbStatus.style.background="#4b1717";dbStatus.style.color="#ffb0b0";}console.error("Firebase connection failed",err);toast("Database connection failed: "+reason);
  }

function normalizeServices(f){
  let raw=f?.services;
  if(!Array.isArray(raw)) raw=f?.serviceItems;
  if(!Array.isArray(raw)) raw=f?.items;
  if(!Array.isArray(raw)) raw=f?.charges;
  if(typeof raw === "string"){
    try{ raw=JSON.parse(raw); }catch(_){ raw=[]; }
  }
  if(raw && !Array.isArray(raw) && typeof raw === "object"){
    raw=Object.entries(raw).map(([k,v])=>({name:v?.name||v?.service||v?.description||k,qty:v?.qty??v?.quantity,rate:v?.rate??v?.price,amount:v?.amount}));
  }
  if(!Array.isArray(raw)) raw=[];
  return raw.map((x,i)=>{
    const name=String(x?.name??x?.service??x?.description??x?.item??SERVICES[i]??"").trim();
    const qty=Number(x?.qty??x?.quantity??0)||0;
    const rate=Number(x?.rate??x?.price??0)||0;
    const amount=Number(x?.amount);
    return {name,qty,rate,amount:Number.isFinite(amount)?amount:qty*rate};
  }).filter(x=>x.qty>0||x.rate>0||x.amount>0);
}
function captureLiveServices(){
  try{
    const rows=[...document.querySelectorAll('#serviceRows .service-row')];
    const direct=rows.map((row,i)=>{
      const name=(row.querySelector('b')?.textContent||SERVICES[i]||'').trim();
      const q=Number(row.querySelector('.qty')?.value)||0;
      const r=Number(row.querySelector('.rate')?.value)||0;
      return {name,qty:q,rate:r,amount:q*r};
    }).filter(x=>x.qty>0||x.rate>0);
    if(direct.length)return direct;
    return SERVICES.map((name,i)=>{
      const q=Number(document.querySelector(`.qty[data-i="${i}"]`)?.value)||0;
      const r=Number(document.querySelector(`.rate[data-i="${i}"]`)?.value)||0;
      return {name,qty:q,rate:r,amount:q*r};
    }).filter(x=>x.qty>0||x.rate>0);
  }catch(e){return [];}
}
function normalizeRecordForOutput(f){
  const r={...(f||{})};
  let services=[];
  // 1) Dedicated immutable snapshot captured at save time.
  if(r.serviceSnapshot){
    try{ services=normalizeServices({services:JSON.parse(r.serviceSnapshot)}); }catch(_){ }
  }
  // 2) Saved service array / legacy structures.
  if(!services.length) services=normalizeServices(r);
  // 3) Last-resort: read the live form while the Service Record page is open.
  if(!services.length) services=captureLiveServices();
  r.services=services;
  r.serviceItems=services.map(x=>({...x}));
  r.serviceSnapshot=JSON.stringify(services);
  r.subtotal=services.reduce((a,x)=>a+Number(x.amount||0),0);
  r.discount=Math.max(0,Number(r.discount)||0);
  r.total=Math.max(0,r.subtotal-r.discount);
  return r;
}

async function saveRecord(){
  const btn=document.getElementById("saveBtn");
  if(!btn || btn.disabled)return;
  if(!fbReady){
    alert("DATABASE IS NOT CONNECTED. Please wait until the green LIVE DATABASE CONNECTED status appears.");
    return;
  }

  const f=getForm();
  f.classification=String(f.classification||"").trim();
  const notApplicable=f.classification==="Not Applicable";

  if(!f.classification){ alert("Please select Service Classification."); return; }
  if(!notApplicable && (!f.vehicleModel||!f.vehicleNumber||!f.currentKm)){
    alert("Please enter Vehicle Model, Vehicle Number and Current KM."); return;
  }
  if(f.mobile && normalizePhone(f.mobile).length!==10){
    alert("Please enter a valid 10-digit mobile number."); return;
  }
  if(!f.services.length){ alert("Please enter at least one service or charge."); return; }

  btn.disabled=true;
  const oldText=btn.textContent;
  btn.textContent="Saving…";

  const id=state.editingRecord?.id || makeKey();
  const data={
    ...f,
    // Immutable copy of exactly what was entered in the service rows.
    serviceSnapshot:JSON.stringify(f.services.map(x=>({...x}))),
    firebaseKey:id,
    savedAt:state.editingRecord?.savedAt || new Date().toISOString(),
    updatedAt:new Date().toISOString()
  };

  try{
    const url=fbUrl("serviceRecords/"+encodeURIComponent(id));
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),12000);
    const response=await fetch(url,{
      method:"PUT",
      mode:"cors",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data),
      signal:controller.signal,
      cache:"no-store"
    });
    clearTimeout(timeout);

    if(!response.ok){
      let detail="";
      try{detail=await response.text()}catch(_){}
      throw new Error("Firebase HTTP "+response.status+(detail?" — "+detail:""));
    }

    const saved=await response.json();
    state.savedRecord={id,...data};
    state.editingRecord=null;
    window._recordSavedThisForm=true;

    ["printBtn","whatsappBtn","sendRecordBtn"].forEach(x=>{
      const el=document.getElementById(x); if(el)el.disabled=false;
    });

    // Firebase has confirmed the write. Never leave the button in "Saving…".
    // Lock this form to prevent an accidental second save/duplicate.
    btn.disabled=true;
    btn.textContent="✓ Service Record Saved";
    btn.classList.add("saved-state");
    showSaved(f.recordNo,false);
    toast("Service record saved successfully.");
  }catch(e){
    console.error("SAVE ERROR",e);
    const reason=e?.name==="AbortError" ? "Firebase write timed out after 12 seconds." : e.message;
    alert("SERVICE RECORD NOT SAVED\n\n"+reason+"\n\nPlease send me a screenshot of this message.");
    btn.disabled=false;
    btn.textContent=oldText;
  }
}

iv class="sub">${SHOP.sub}</div><div class="addr">${SHOP.address.join("<br>")}<br>${SHOP.phone}</div></div><div><div class="tag">SERVICE RECORD</div><div class="meta">Service Record No: <b>#${esc(f.recordNo)}</b><br>Date: <b>${esc(f.date)}</b></div></div></div><div class="boxes"><div class="box"><h3>CUSTOMER INFORMATION</h3><div class="kv"><span>Customer Name:</span><b>${esc(f.customerName||"—")}</b><span>Mobile No.:</span><b>${esc(f.mobile||"—")}</b></div></div><div class="box"><h3>VEHICLE &amp; SERVICE DETAILS</h3><div class="kv"><span>Vehicle Model:</span><b>${esc(f.vehicleModel)}</b><span>Vehicle Reg. No.:</span><b>${esc(f.vehicleNumber)}</b><span>Current KM:</span><b>${Number(f.currentKm).toLocaleString("en-IN")} KM</b><span>Service Type:</span><b>${esc(f.classification)}</b><span>Technician:</span><b>${esc(f.technician||"—")}</b></div></div></div><table><thead><tr><th>S.NO</th><th>SERVICE / ITEM DESCRIPTION</th><th>QTY</th><th>RATE (₹)</th><th>AMOUNT (₹)</th></tr></thead><tbody>${rows}</tbody></table><div class="lower"><div class="remarks"><h3>REMARKS</h3><p>1. ${esc(f.workDone||"This document is a service record.")}</p><p>2. Services are performed using calibrated and computerized equipment where applicable.</p></div><div class="tot"><div class="line"><span>Subtotal</span><b>${money(f.subtotal)}</b></div><div class="line"><span>Discount</span><b>${money(f.discount)}</b></div><div class="line grand"><span>Grand Total</span><b>${money(f.total)}</b></div></div></div><div class="sign"><div>For SRI HARI TYRES<br>(Authorized Signatory)</div></div>${f.classification!=="Not Applicable"?`<div class="schedule-wrap"><div class="schedule-title">NEXT SERVICE SCHEDULE</div>${schedule}<div class="note"><b>Note:</b> Please bring this Service Record during your next visit.</div></div>`:""}<div class="thank">Thank you for choosing Sri Hari Tyres.<br><span>We appreciate your continued trust.</span></div><div class="footer">${SHOP.address.join(" • ")} &nbsp; | &nbsp; ${SHOP.phone} &nbsp; | &nbsp; Drive Safe, Stay Safe</div></div><script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`}
function openPrint(f){

function startOfWeek(){const d=new Date(),day=d.getDay(),diff=day===0?6:day-1;d.setDate(d.getDate()-diff);return d.toISOString().slice(0,10)}
function firstOfMonth(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`}
function filterBar(prefix,defaultsToday=true){const f=defaultsToday?today():"0000-01-01",t=defaultsToday?today():"9999-12-31";return `<div class="filterbar"><div><label>From Date</label><input id="${prefix}From" type="date" value="${f}"></div><div><label>To Date</label><input id="${prefix}To" type="date" value="${t}"></div><div class="filter-actions"><button class="btn blue" id="${prefix}Apply">Apply</button><button class="btn" id="${prefix}Clear">Clear</button></div></div><div class="quick-filters"><button data-qfilter="${prefix}:today">Today</button><button data-qfilter="${prefix}:week">This Week</button><button data-qfilter="${prefix}:month">This Month</button><button data-qfilter="${prefix}:all">All</button></div>`}
function bindDateFilter(prefix,cb){$(`#${prefix}Apply`).onclick=()=>{const f=$(`#${prefix}From`).value,t=$(`#${prefix}To`).value;if(f&&t&&f>t){alert("From Date cannot be after To Date.");return}cb(f,t)};$(`#${prefix}Clear`).onclick=()=>{const d=today();$(`#${prefix}From`).value=d;$(`#${prefix}To`).value=d;cb(d,d)};document.querySelectorAll(`[data-qfilter^="${prefix}:"]`).forEach(b=>b.onclick=()=>{const m=b.dataset.qfilter.split(":")[1];let f=today(),t=today();if(m==="week")f=startOfWeek();if(m==="month")f=firstOfMonth();if(m==="all"){f="0000-01-01";t="9999-12-31"}$(`#${prefix}From`).value=f;$(`#${prefix}To`).value=t;cb(f,t)})}
function vehicleHistory(vehicleNumber){return state.records.filter(r=>String(r.vehicleNumber||'').toUpperCase()===String(vehicleNumber||'').toUpperCase()).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.savedAt||'').localeCompare(a.savedAt||''))}
function latestAlignmentRecord(vehicleNumber){return vehicleHistory(vehicleNumber).find(r=>r.classification==='Wheel Alignment Service'||r.classification==='Regular Service')||null}
function vehicleProfileData(vehicleNumber){const h=vehicleHistory(vehicleNumber),latest=h[0]||null,align=latestAlignmentRecord(vehicleNumber),free=align?Number(align.currentKm||0)+2000:null,paid=align?Number(align.currentKm||0)+5000:null,current=latest?Number(latest.currentKm||0):0;return {h,latest,align,free,paid,current}}
function kmProgress(current,target){if(!target||!current)return {pct:0,remaining:target?Math.max(0,target-current):0};const base=Math.max(0,target-5000),span=Math.max(1,target-base),pct=Math.min(100,Math.max(0,((current-base)/span)*100));return {pct,remaining:Math.max(0,target-current)}}
function customerReturnRate(){const map={};state.records.forEach(r=>{const v=String(r.vehicleNumber||'').trim().toUpperCase();if(v)map[v]=(map[v]||0)+1});const vehicles=Object.keys(map);const returning=vehicles.filter(v=>map[v]>1).length;return {vehicles,returning,rate:vehicles.length?Math.round(returning/vehicles.length*100):0}}
function reminderPriority(x){const now=today(),due=x.dueDate<=now;if(due)return {label:'DUE NOW',cls:'due'};const d=new Date(x.dueDate+'T00:00:00'),n=new Date(now+'T00:00:00'),days=Math.ceil((d-n)/86400000);if(days<=7)return {label:`DUE IN ${days}D`,cls:'soon'};return {label:'UPCOMING',cls:'ok'}}
async function oneTapCustomerPackage(r){if(!r)return;try{const doc=await makeServicePDF(r),blob=doc.output('blob'),file=new File([blob],`Sri_Hari_Tyres_Service_Record_${r.recordNo}.pdf`,{type:'application/pdf'}),text=serviceCompletionMessage(r)||'';if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({title:`Sri Hari Tyres Service Record #${r.recordNo}`,text,files:[file]});toast('Customer package ready to share.')}else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('PDF created. Use WhatsApp Customer for the message.')}}catch(e){if(e?.name!=='AbortError')alert('Could not prepare the customer package: '+(e?.message||'Unknown error'))}}
function vehicleProfileHTML(r){const d=vehicleProfileData(r.vehicleNumber),p=kmProgress(d.current,d.free),q=kmProgress(d.current,d.paid);const h=d.h;return `<div class="profile-panel"><div class="profile-top"><div><div class="profile-title">🚗 ${esc(r.vehicleNumber)}</div><div class="profile-sub">${esc(r.vehicleModel||d.latest?.vehicleModel||'Vehicle')} • ${h.length} service record(s)</div></div><div class="profile-actions"><button class="btn blue" data-package="${esc(r.vehicleNumber)}">📦 Customer Package</button><button class="btn" data-profile-history="${esc(r.vehicleNumber)}">View Full History</button></div></div><div class="profile-grid"><div class="profile-box"><span>Customer</span><b>${esc(r.customerName||d.latest?.customerName||'—')}</b></div><div class="profile-box"><span>Mobile</span><b>${esc(r.mobile||d.latest?.mobile||'—')}</b></div><div class="profile-box"><span>Current KM</span><b>${d.current?d.current.toLocaleString('en-IN')+' KM':'—'}</b></div><div class="profile-box"><span>Last Service</span><b>${prettyDate(d.latest?.date)}</b></div></div>${d.align?`<div class="km-card"><div class="km-head"><b>📈 KM Progress Tracker</b><span>Last alignment: ${Number(d.align.currentKm||0).toLocaleString('en-IN')} KM</span></div><div class="progress-item"><div><b>Free Service</b><span>${d.free.toLocaleString('en-IN')} KM</span></div><div class="progress"><i style="width:${p.pct}%"></i></div><small>${p.remaining.toLocaleString('en-IN')} KM remaining</small></div><div class="progress-item"><div><b>Paid Wheel Alignment</b><span>${d.paid.toLocaleString('en-IN')} KM</span></div><div class="progress"><i style="width:${q.pct}%"></i></div><small>${q.remaining.toLocaleString('en-IN')} KM remaining</small></div></div>`:''}<div class="timeline"><h4>🚗 Vehicle Service Timeline</h4>${h.slice(0,8).map(x=>`<div class="timeline-item"><div class="timeline-dot"></div><div><b>${prettyDate(x.date)} • ${Number(x.currentKm||0).toLocaleString('en-IN')} KM</b><span>${esc(x.classification||'Service')} • ${esc(x.technician||'—')}</span><small>${(x.services||[]).map(y=>esc(y.name)).join(', ')||'No service items'}</small></div></div>`).join('')}</div></div>`}

function renderVehicles(){const latest={};state.records.filter(r=>r.date===today()).forEach(r=>{if(r.vehicleNumber&&!latest[r.vehicleNumber])latest[r.vehicleNumber]=r});const all=Object.values(latest),models=[...new Set(state.records.map(r=>r.vehicleModel).filter(Boolean))].sort();$("#main").innerHTML=`<div class="page-head"><h1>Vehicles</h1><button class="btn primary" id="newVehicleRecord">+ Service Record</button></div><section class="card"><div class="filterbar vehicle-filterbar"><div><label>Search</label><input id="vehicleSearch" placeholder="Vehicle, customer, mobile or model"></div><div><label>From Date</label><input id="vehicleFrom" type="date" value="${today()}"></div><div><label>To Date</label><input id="vehicleTo" type="date" value="${today()}"></div><div class="filter-actions"><button class="btn blue" id="vehicleApply">Apply</button><button class="btn" id="vehicleClear">Clear</button></div></div><div class="quick-filters"><button id="vehicleToday">Today</button><button id="vehicleWeek">This Week</button><button id="vehicleMonth">This Month</button><button id="vehicleAll">All</button></div><div class="grid2"><div><label>Vehicle Model</label><select id="vehicleModelFilter"><option value="">All Models</option>${models.map(m=>`<option>${esc(m)}</option>`).join("")}</select></div><div><label>Service Type</label><select id="vehicleClassFilter"><option>All Services</option><option>Free Service</option><option>Wheel Alignment Service</option><option>Not Applicable</option></select></div></div><div class="result-bar"><b id="vehicleCount">${all.length} vehicle(s)</b><span>Default: today's vehicles</span></div><div id="vehicleList">${vehicleRows(all)}</div></section>`;const paint=(f=today(),t=today())=>{let src=dateFiltered(state.records,f,t),map={};src.forEach(r=>{if(r.vehicleNumber&&!map[r.vehicleNumber])map[r.vehicleNumber]=r});let arr=Object.values(map),q=$("#vehicleSearch").value.toLowerCase().trim(),m=$("#vehicleModelFilter").value,c=$("#vehicleClassFilter").v function backupExcel(from,to){
  if(typeof XLSX==="undefined"){alert("Excel backup library is not available. Please refresh the page and try again.");return;}
  if(!from||!to||from>to){alert("Please select a valid From Date and To Date.");return;}
  const records=dateFiltered(state.records,from,to);
  const rows=records.map(r=>({
    "Record No":r.recordNo||"","Date":r.date||"","Customer Name":r.customerName||"","Mobile":r.mobile||"",
    "Vehicle Model":r.vehicleModel||"","Vehicle Number":r.vehicleNumber||"","Current KM":Number(r.currentKm||0),
    "Service Classification":r.classification||"","Technician":r.technician||"","Customer Complaint":r.complaint||"",
    "Work Completed / Remarks":r.workDone||"","Subtotal":Number(r.subtotal||0),"Discount":Number(r.discount||0),"Grand Total":Number(r.total||0)
  }));
  const items=[];
  records.forEach(r=>(r.services||[]).forEach(x=>items.push({"Record No":r.recordNo||"","Date":r.date||"","Vehicle Number":r.vehicleNumber||"","Service / Item":x.name||"","Qty":Number(x.qty||0),"Rate":Number(x.rate||0),"Amount":Number(x.amount||0)})));
  const reminders=state.reminders.filter(x=>(x.dueDate||"")>=from&&(x.dueDate||"")<=to).map(x=>({"Reminder Type":x.type||"","Reminder Date":x.dueDate||"","Vehicle Number":x.vehicleNumber||"","Customer Name":x.customerName||"","Mobile":x.mobile||"","Due KM":Number(x.dueKm||0),"Status":x.status||"pending"}));
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{"Record No":"No service records in selected period"}]);
  const wi=XLSX.utils.json_to_sheet(items.length?items:[{"Record No":"","Date":"","Vehicle Number":"","Service / Item":"No service items in selected period"}]);
  const wr=XLSX.utils.json_to_sheet(reminders.length?reminders:[{"Reminder Type":"No reminders in selected period"}]);
  XLSX.utils.book_append_sheet(wb,ws,"Service Records");XLSX.utils.book_append_sheet(wb,wi,"Service Items");XLSX.utils.book_append_sheet(wb,wr,"Reminders");
  const stamp=from===to?from:`${from}_to_${to}`;
  XLSX.writeFile(wb,`Sri_Hari_Tyres_Backup_${stamp}.xlsx`);
  toast(`Excel backup created for ${prettyDate(from)} to ${prettyDate(to)}.`);
}

async function qaRunSafe(){
  /*
    FULL SAFE QA RUNNER
    - Runs all 45 cases in one click.
    - Never writes/deletes Firebase data.
    - Tests that require real Firebase writes, WhatsApp delivery, PDF sharing,
      offline network, or another device are explicitly marked BLOCKED/MANUAL.
    - A FAIL means the live page logic itself could not satisfy the expected rule.
  */
  const originalPage=state.page;
  const results={};
  const q=qaState();

  const record=(id,status,remarks,auto=true)=>{
    results[id]={status,remarks,autoRun:auto};
    q[id]=results[id];
    qaPut(q);
  };

  const pass=(id,msg)=>record(id,"PASS","AUTO: "+msg);
  const fail=(id,msg)=>record(id,"FAIL","AUTO: "+msg);
  const manual=(id,msg)=>record(id,"BLOCKED","MANUAL: "+msg,false);

  const run=(id,fn)=>{
    try{
      const r=fn();
      if(r===true) pass(id,"Check passed.");
      else if(r===false) fail(id,"Expected condition was not met.");
      else fail(id,String(r||"Check returned no result."));
    }catch(e){
      fail(id,"Exception: "+(e?.message||String(e)));
    }
  };

  try{
    /* Fresh form sandbox. */
    state.editingRecord=null;
    state.savedRecord=null;
    renderService();

    // TC-01
    run("TC-01",()=>!!$("#recordNo")&&!!$("#vehicleModel")&&!!$("#vehicleNumber")&&!!$("#currentKm")&&!!$("#classification")&&!!$("#technician")&&!!$("#saveBtn"));

    // TC-02
    run("TC-02",()=>{
      const next=recordNo();
      const all=state.records.map(r=>recordKey(r.recordNo)).filter(Boolean);
      if(!next)return false;
      if(!all.length)return /^\d+$/.test(String(next));
      return !!recordKey(next);
    });

    // TC-03 required-field validation: invoke only the validation gate; no network write.
    run("TC-03",()=>{
      const oldReady=fbReady, oldAlert=window.alert;
      let alerted=false;
      try{
        fbReady=true;
        renderService();
        $("#classification").value="";
        window.alert=()=>{alerted=true};
        saveRecord();
      }finally{
        fbReady=oldReady;
        window.alert=oldAlert;
      }
      return alerted;
    });

    // TC-04
    run("TC-04",()=>{
      renderService();
      $("#classification").value="Not Applicable";
      updateServiceRequiredState();
      return [...document.querySelectorAll(".req-vehicle")].every(x=>x.style.display==="none");
    });

    // TC-05
    run("TC-05",()=>{
      const h=printHTML({recordNo:"QA-NA",date:today(),classification:"Not Applicable",customerName:"QA",mobile:"",vehicleModel:"",vehicleNumber:"",currentKm:0,technician:"",services:[{name:"T/L Valve",qty:1,rate:100,amount:100}],subtotal:100,discount:0,total:100});
      return !h.includes("NEXT SERVICE SCHEDULE");
    });

    // TC-06
    run("TC-06",()=>{
      const r=normalizeRecordForOutput({
        recordNo:"QA-06",customerName:"Test Customer",mobile:"9876543210",

        classification:"Wheel Alignment Service",technician:"ARAVIND",

      });
      return r.customerName==="Test Customer"&&r.mobile==="9876543210"&&
             r.vehicleNumber==="TN49AB1234"&&r.services[0].amount===400;
    });

    // TC-07
    run("TC-07",()=>{
      const r=state.records.find(x=>x.vehicleNumber&&x.customerName);
      if(!r)return true; // nothing to exercise, but the loader itself is present

    manual("TC-23","Requires confirming the newly saved live record appears in Service History.");

    // TC-24
    run("TC-24",()=>{
      const r=state.records.find(x=>x.vehicleNumber);
      if(!r)return typeof vehicleProfileData==="function";
      const d=vehicleProfileData(r.vehicleNumber);
      return Array.isArray(d.h)&&typeof d.current==="number";
    });

    // TC-25
    run("TC-25",()=>{
      const r=state.records.find(x=>x.vehicleNumber);
      if(!r)return true;
      const h=vehicleHistory(r.vehicleNumber);
      return h.every((x,i)=>i===0 || String(h[i-1].date||"")>=String(x.date||""));
    });

    manual("TC-26","Opening the browser print/PDF dialog is device/browser dependent.");

    // TC-27
    run("TC-27",()=>{
      const h=printHTML({
        recordNo:"QA-27",date:today(),classification:"Wheel Alignment Service",
        vehicleModel:"Nexon",vehicleNumber:"TN49AB1234",currentKm:25000,
        technician:"ARAVIND",
        services:[
          {name:"Wheel Alignment",qty:1,rate:400,amount:400},
          {name:"Wheel Balancing",qty:2,rate:350,amount:700},
          {name:"Rotation",qty:3,rate:400,amount:1200}
        ],subtotal:2300,discount:50,total:2250
      });
      return ["Wheel Alignment","Wheel Balancing","Rotation","400.00","700.00","1200.00"].every(x=>h.includes(x));
    });

    // TC-28
    run("TC-28",()=>{
      const r=normalizeRecordForOutput({
        services:[{name:"A",qty:1,rate:400},{name:"B",qty:2,rate:350}],
        discount:50
      });
      return r.subtotal===1100&&r.discount===50&&r.total===1050;
    });

    // TC-29
    run("TC-29",()=>{
      const samples=[0,50,400,1050,2250,12345.67];
      return samples.every(n=>{
        const m=money(n);
        return /^₹[\d,]+\.\d{2}$/.test(m);
      });
    });

    // TC-30
    run("TC-30",()=>{
      const m=serviceCompletionMessage({
        customerName:"Test Customer",vehicleNumber:"TN49AB1234",
        currentKm:25000,classification:"Wheel Alignment Service"
      });
      return !!m&&m.includes("Test Customer")&&m.includes("TN49AB1234")&&m.includes("NEXT SERVICE SCHEDULE");
    });

    manual("TC-31","Preparing/sharing the actual PDF through Android WhatsApp requires a real device test.");
    manual("TC-32","Actual WhatsApp PDF receipt by the customer cannot be verified safely from this page.");

    // TC-33
    run("TC-33",()=>{
      const h=printHTML({
        recordNo:"QA-33",date:today(),classification:"Wheel Alignment Service",
        vehicleModel:"Nexon",vehicleNumber:"TN49AB1234",currentKm:25000,
        services:[
          {name:"Wheel Alignment",qty:1,rate:400,amount:400},
          {name:"Wheel Balancing",qty:2,rate:350,amount:700},
          {name:"Rotation",qty:3,rate:400,amount:1200}
        ],subtotal:2300,discount:0,total:2300
      });
      return h.indexOf("Wheel Alignment")>=0&&h.indexOf("Wheel Balancing")>=0&&h.indexOf("Rotation")>=0;
    });

    // TC-34
    run("TC-34",()=>{
      const h=printHTML({
        recordNo:"QA-34",date:today(),classification:"Wheel Alignment Service",
        vehicleModel:"Nexon",vehicleNumber:"TN49AB1234",currentKm:25000,
        services:[{name:"Wheel Alignment",qty:1,rate:400,amount:400}],
        subtotal:400,discount:0,total:400
      });
      return h.includes("FREE SERVICE")&&h.includes("27,000 KM")&&h.includes("30,000 KM");
    });

    // TC-35
    run("TC-35",()=>{
      const h=printHTML({
        recordNo:"QA-35",date:today(),classification:"Regular Service",
        vehicleModel:"Nexon",vehicleNumber:"TN49AB1234",currentKm:28000,
        services:[{name:"Wheel Alignment",qty:1,rate:400,amount:400}],
        subtotal:400,discount:0,total:400
      });
      return h.includes("FREE SERVICE")&&h.includes("30,000 KM")&&h.includes("33,000 KM");
    });

    // TC-36
    run("TC-36",()=>{
      const h=printHTML({recordNo:"QA-36",date:today(),classification:"Not Applicable",services:[],subtotal:0,discount:0,total:0});
      return !h.includes("NEXT SERVICE SCHEDULE");
    });

    manual("TC-37","Reminder creation writes to Firebase and requires a controlled live-data test.");

    // TC-38
    run("TC-38",()=>{
      const overdue=reminderPriority({dueDate:addDays(today(),-1)});
      const soon=reminderPriority({dueDate:addDays(today(),3)});
      const upcoming=reminderPriority({dueDate:addDays(today(),30)});
      return overdue.label==="DUE NOW"&&soon.label==="DUE IN 3D"&&upcoming.label==="UPCOMING";
    });

    // TC-39
    run("TC-39",()=>{
      const backup=state.records;
      state.records=[
        {vehicleNumber:"QA111",date:today()},
        {vehicleNumber:"QA111",date:today()},
        {vehicleNumber:"QA222",date:today()}
      ];
      const r=customerReturnRate();
      state.records=backup;
      return r.vehicles.length===2&&r.returning===1&&r.rate===50;
    });

    // TC-40
    run("TC-40",()=>{
      renderService();
      $("#customerName").value="QA Test";
      $("#vehicleModel").value="Nexon";
      $("#vehicleNumber").value="TN49QA0001";
      $("#clearBtn").click();
      return $("#customerName")?.value===""&&$("#vehicleModel")?.value===""&&$("#vehicleNumber")?.value==="";
    });

    // TC-41: verify browser-side state storage used by QA; live Firebase persistence remains manual.
    run("TC-41",()=>{
      const key="__qa_persistence_probe__";
      localStorage.setItem(key,"ok");
      const ok=localStorage.getItem(key)==="ok";
      localStorage.removeItem(key);
      return ok&&typeof onValue==="function";
    });

    manual("TC-42","Offline/network failure requires physically disconnecting the device network.");
    manual("TC-43","Android-specific workflow must be exercised on the actual Android device.");
    manual("TC-44","Desktop-specific workflow must be exercised on a desktop browser.");

    // TC-45
    run("TC-45",()=>{
      const r=normalizeRecordForOutput({
        recordNo:"QA-45",date:today(),customerName:"QA Customer",
        mobile:"9876543210",vehicleModel:"Nexon",vehicleNumber:"TN49AB1234",
        currentKm:25000,classification:"Wheel Alignment Service",technician:"ARAVIND",
        services:[{name:"Wheel Alignment",qty:1,rate:400,amount:400},
                  {name:"Wheel Balancing",qty:2,rate:350,amount:700}],
        subtotal:1100,discount:50,total:1050
      });
      const h=printHTML(r);
      return h.includes("QA Customer")&&h.includes("TN49AB1234")&&
             h.includes("Wheel Alignment")&&h.includes("Wheel Balancing")&&
             h.includes("₹1,050.00")&&h.includes("₹1,100.00");
    });

  }finally{
    // Make sure every case has an explicit result after one-click execution.
    for(const c of QA_CASES){
      if(!results[c[0]]) manual(c[0],"No safe automated check is available for this case.");
    }
    qaPut(q);
    state.editingRecord=null;
    state.savedRecord=null;
    state.page="qa";
    renderQA();
    const autoCount=Object.values(q).filter(x=>x?.autoRun).length;
    const passCount=Object.values(q).filter(x=>x?.status==="PASS").length;
    const failCount=Object.values(q).filter(x=>x?.status==="FAIL").length;
    const blockedCount=Object.values(q).filter(x=>x?.status==="BLOCKED").length;
    const info=$("#qaAutoInfo");
    if(info)info.textContent=`Full QA run complete: ${autoCount} automated • ${passCount} PASS • ${failCount} FAIL • ${blockedCount} manual/blocked.`;
  }
}

render();
initFirebase();

</script>
