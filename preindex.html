function v2Escape(s){
  return String(s==null?"":s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function v2TestRow(id, module, scenario, status, detail){
  return `<div style="padding:7px 6px;border-bottom:1px solid #d9dee7">
    <b>${status==="PASS"?"✅ PASS":status==="FAIL"?"❌ FAIL":"⚠️ MANUAL"}</b>
    <span style="font-weight:700">${v2Escape(id)}</span>
    <span>${v2Escape(module)} — ${v2Escape(scenario)}</span>
    ${detail?`<div class="small" style="margin-top:3px">${v2Escape(detail)}</div>`:""}
  </div>`;
}

function v2Check(condition, detail){
  return {status:condition?"PASS":"FAIL",detail:detail||""};
}

function v2RunSingleTest(tc){
  const src=document.documentElement.outerHTML;
  const lower=src.toLowerCase();

  // Deterministic checks for the requirements represented by the 75-case master sheet.
  switch(tc.id){
    case "TC15":
      return v2Check(typeof nextNo==="function" && src.includes('max<9999') && src.includes('A1'),
        "Record numbering contains the 9999 → A1 rollover.");
    case "TC27":
      return v2Check(src.includes("SRI HARI TYRES") &&
        src.includes("AUTHORISED CEAT TYRES & SERVICE CENTRE") &&
        src.includes("50-1, Venkatesha Nagar") &&
        src.includes("6382212457"), "Exact shop header/address/phone found.");
    case "TC33":
      return v2Check(src.includes("2000") && src.includes("5000") && src.includes("2 months"),
        "Paid/Wheel Alignment schedule rules found.");
    case "TC34":
    case "TC41":
    case "TC69":
      return v2Check(src.includes("FREE SERVICE COMPLETED") &&
        src.includes('r.type==="Free Service"'),
        "FREE SERVICE COMPLETED is conditional on actual Free Service.");
    case "TC35":
      return v2Check(src.includes("setFillColor(23,63,145)") && src.includes("true"),
        "PDF blue header drawing/text code found.");
    case "TC45":
      return v2Check(src.includes("within 1 month"), "WhatsApp paid-service wording contains within 1 month.");

        "TC51":["confirm("], "TC52":["clearV2TestRecords"], "TC53":["localStorage"], "TC55":["v2PrintRecord","v2SendPDF"],

function runV2AutomatedTests(){
  const results=V2_MASTER_TEST_CASES.map(tc=>({...tc,...v2RunSingleTest(tc)}));
  const pass=results.filter(x=>x.status==="PASS").length;
  const fail=results.filter(x=>x.status==="FAIL").length;
  const manual=results.filter(x=>x.status==="MANUAL").length;

  const summary=document.getElementById("v2TestSummary");
  if(summary){
    summary.innerHTML=`<div style="font-weight:800;font-size:15px">V2 TEST RUN — 75 CASES</div>
      <div style="margin-top:6px">✅ ${pass} PASS &nbsp; ❌ ${fail} FAIL &nbsp; ⚠️ ${manual} MANUAL</div>
      <div class="small" style="margin-top:5px">Run time: ${new Date().toLocaleString("en-IN")}</div>`;
  }
  const box=document.getElementById("v2TestResults");
  if(box){
    box.innerHTML=results.map(x=>v2TestRow(x.id,x.module,x.scenario,x.status,x.detail)).join("");
  }
  return results;
}

    let n=max+1;
    while(used.includes(String(n)) && n<=9999)n++;
    if(n<=9999)return String(n);
  }
  for(let i=1;i<=26*9999;i++){
    let q=i, label="";
    while(q>0){q--; label=String.fromCharCode(65+(q%26))+label; q=Math.floor(q/26);}

function v3EditRecord(id){const r=S.records.find(x=>x.id===id);if(!r)return;S.editingId=id;service();setTimeout(()=>{const set=(id,v)=>{const e=$(id);if(e)e.value=v??''};set('no',r.no);set('date',r.date);set('customer',r.customer);set('mobile',r.mobile);set('vehicle',r.vehicle);set('model',r.model);set('km',r.km);set('tech',r.tech);set('type',r.type);set('discount',r.discount||0);updateRequired();(r.items||[]).forEach((it,i)=>{const tr=document.querySelectorAll('#serviceRows .service-row')[i];if(tr){tr.querySelector('.qty').value=it.qty||0;tr.querySelector('.rate').value=it.rate||0}});calc();const b=$('save');if(b){b.textContent='Update Service Record';b.onclick=v3EditSave}},0)}
function v3EditSave(){
 const id=S.editingId,r=S.records.find(x=>x.id===id);if(!r)return;const g=id=>$(id);const type=g('type')?.value||'';

 const items=[...document.querySelectorAll('#itemsBody tr')].map(tr=>{const n=tr.querySelector('.iname')?.value||tr.dataset.name||'';const q=Number(tr.querySelector('.qty')?.value||0),rate=Number(tr.querySelector('.rate')?.value||0);return {name:n,qty:q,rate,amount:q*rate}});
 const subtotal=items.reduce((a,x)=>a+x.amount,0),discount=Number(g('discount')?.value||0);

function v4DateAddMonths(iso,months){
 if(!iso)return"";const a=iso.split("-").map(Number);if(a.length!==3||!a[0])return"";
 const d=new Date(a[0],a[1]-1,a[2]);d.setMonth(d.getMonth()+months);
 return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function v4ReminderDateLabel(iso){return iso?dd(iso):"KM based"}
function v4ReminderSourceKey(r,kind){return `auto_${r.id}_${kind}`}
function v4BuildReminders(){
 const out=[];const records=S.records||[];
 records.forEach(r=>{
   if(r.type!=="Wheel Alignment Service"||!r.km)return;
   const km=Number(r.km)||0;if(!km)return;
   const freeId=v4ReminderSourceKey(r,"free"),paidId=v4ReminderSourceKey(r,"paid");
   const laterFree=records.some(x=>x.id!==r.id&&x.vehicle===r.vehicle&&x.type==="Free Service"&&((x.date||"")>(r.date||"")||((x.date||"")===(r.date||"")&&Number(x.km||0)>=km+2000)));
   const laterPaid=records.some(x=>x.id!==r.id&&x.vehicle===r.vehicle&&x.type==="Wheel Alignment Service"&&((x.date||"")>(r.date||"")||((x.date||"")===(r.date||"")&&Number(x.km||0)>=km+5000)));
   out.push({id:freeId,source:"Automatic",sourceRecord:r.id,kind:"Next Free Service",customer:r.customer||"",mobile:r.mobile||"",vehicle:r.vehicle||"",model:r.model||"",dueKm:km+2000,dueDate:v4DateAddMonths(r.date,2),createdDate:r.date,baseKm:km,status:laterFree||((S.reminderStatus||{})[freeId]==="completed")?"completed":"open"});
   out.push({id:paidId,source:"Automatic",sourceRecord:r.id,kind:"Next Paid Wheel Alignment",customer:r.customer||"",mobile:r.mobile||"",vehicle:r.vehicle||"",model:r.model||"",dueKm:km+5000,dueDate:"",createdDate:r.date,baseKm:km,status:laterPaid||((S.reminderStatus||{})[paidId]==="completed")?"completed":"open"});
 });
 (S.reminders||[]).forEach(r=>out.push({...r,source:"Manual",status:(S.reminderStatus||{})[r.id]==="completed"?"completed":(r.status||"open")}));
 return out;
}
function v4CurrentVehicleKm(vehicle){
 const rs=(S.records||[]).filter(r=>r.vehicle===vehicle&&Number(r.km)).sort((a,b)=>Number(b.km)-Number(a.km));
 return rs.length?Number(rs[0].km):0;
}
function v4ReminderState(r){
 if(r.status==="completed")return"completed";
 const now=today(),cur=v4CurrentVehicleKm(r.vehicle);
 if(r.dueKm&&cur>=Number(r.dueKm))return"overdue";
 if(r.dueDate){
   if(r.dueDate<now)return"overdue";
   const d1=new Date(now),d2=new Date(r.dueDate),days=Math.ceil((d2-d1)/86400000);
   if(days<=30)return"due-soon";
 }
 if(r.dueKm&&cur){const diff=Number(r.dueKm)-cur;if(diff<=500)return"due-soon";}
 return"upcoming";
}

}
function v4SendReminderWhatsApp(id){

 const phone=(r.mobile||"").replace(/\D/g,"");const url=(phone?`https://wa.me/${phone}`:`https://wa.me/`)+`?text=${encodeURIComponent(v4ReminderMessage(r))}`;
 window.open(url,"_blank");
}
function v4CompleteReminder(id){

}
function v4RestoreReminder(id){

}

function reminders(){
 S.reminderUI=S.reminderUI||{tab:"overdue",pageSize:20,visible:20};

      const st=v4ReminderState(r);

function reports(){const a=filtered();const value=a.reduce((n,r)=>n+Number(r.total||0),0);$('content').innerHTML=`<div class="card"><h2>Reports</h2><div class="v5-actions"><button class="primary v5-preset ${S.filter.mode==='today'?'active':''}" onclick="v5SetPreset('today')">Today</button><button class="secondary v5-preset" onclick="v5SetPreset('week')">This Week</button><button class="secondary v5-preset" onclick="v5SetPreset('month')">This Month</button><button class="secondary v5-preset" onclick="v5SetPreset('all')">All Records</button></div><div class="v5-actions" style="margin-top:10px"><div><label>From Date</label><input id="v5From" type="date" value="${S.filter.mode==='period'?S.filter.from:''}"></div><div><label>To Date</label><input id="v5To" type="date" value="${S.filter.mode==='period'?S.filter.to:''}"></div><button class="primary" onclick="v5ApplyCustom()">Apply Custom Range</button></div><p class="v5-note" style="margin-top:10px">Showing: <b>${v5PeriodLabel()}</b></p></div><div class="v5-kpis"><div class="v5-kpi"><span>TOTAL SERVICES</span><b>${a.length}</b></div><div class="v5-kpi"><span>TOTAL SERVICE VALUE</span><b>${money(value)}</b></div><div class="v5-kpi"><span>FREE SERVICES</span><b>${a.filter(r=>r.type==='Free Service').length}</b></div><div class="v5-kpi"><span>REGULAR SERVICES</span><b>${a.filter(r=>r.type==='Wheel Alignment Service').length}</b></div></div><div class="v5-grid"><div class="card"><h2>Service Mix by Classification</h2>${v5Mix(a)}</div><div class="card"><h2>Top Services Performed</h2>${v5TopServices(a)}</div><div class="card"><h2>Daily Service Trend</h2>${v5Trend(a)}</div><div class="card"><h2>Vehicle / Customer Insights</h2>${v5Insights(a)}</div></div><div class="card"><h2>Export Reports</h2><div class="v5-actions"><button class="primary" onclick="v5ExportExcel()">⬇ Export Excel</button><button class="primary" onclick="v5ExportPDF()">📄 Export PDF</button></div><p class="v5-note">Exports use the same selected report period shown above.</p></div>`}
function v5PeriodLabel(){if(S.filter.mode==='today')return 'Today ('+dd(today())+')';if(S.filter.mode==='period')return dd(S.filter.from)+' – '+dd(S.filter.to);return 'All Records'}
function v5SetPreset(kind){const d=new Date();const iso=x=>x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());if(kind==='today'){setToday();return}if(kind==='all'){S.filter={mode:'period',from:'0000-01-01',to:'9999-12-31'};render();return}if(kind==='week'){const day=d.getDay();const start=new Date(d);start.setDate(d.getDate()-(day===0?6:day-1));S.filter={mode:'period',from:iso(start),to:iso(d)};render();return}if(kind==='month'){const start=new Date(d.getFullYear(),d.getMonth(),1);S.filter={mode:'period',from:iso(start),to:iso(d)};render()}}
function v5ApplyCustom(){const f=$('v5From').value,t=$('v5To').value;if(!f||!t)return alert('Select both From Date and To Date.');if(f>t)return alert('From Date cannot be after To Date.');S.filter={mode:'period',from:f,to:t};render()}
function v5Mix(a){const defs=[['Free Service',a.filter(r=>r.type==='Free Service').length],['Wheel Alignment Service',a.filter(r=>r.type==='Wheel Alignment Service').length],['Not Applicable',a.filter(r=>r.type==='Not Applicable').length]];const max=Math.max(1,...defs.map(x=>x[1]));return '<div class="v5-list">'+defs.map(x=>`<div class="v5-row"><span>${esc(x[0])}</span><b>${x[1]}</b><div style="grid-column:1/-1"><div class="v5-bar"><i style="width:${(x[1]/max)*100}%"></i></div></div></div>`).join('')+'</div>'}
function v5TopServices(a){const map={};a.forEach(r=>(r.items||[]).forEach(i=>{const n=(i.name||'').trim();if(n)map[n]=(map[n]||0)+Number(i.qty||0)}));const list=Object.entries(map).sort((x,y)=>y[1]-x[1]).slice(0,8);if(!list.length)return '<div class="empty">No service items in selected period.</div>';const max=Math.max(1,...list.map(x=>x[1]));return '<div class="v5-list">'+list.map(x=>`<div class="v5-row"><span>${esc(x[0])}<div class="v5-bar"><i style="width:${(x[1]/max)*100}%"></i></div></span><b>${x[1]}</b></div>`).join('')+'</div>'}

async function secureFirebaseStart(user){
 try{
  if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
  sriHariUser=user;window.sriHariUser=user;
  v6Db=firebase.database();
  v6Ref=v6Db.ref('sriHariTyres/appData');
  const snap=await v6Ref.once('value');
  const d=snap.val();
  if(d&&Array.isArray(d.records)){
   S.records=d.records||[];
   S.tech=Array.isArray(d.tech)&&d.tech.length?d.tech:S.tech;
   S.reminders=d.reminders||[];
   S.reminderStatus=d.reminderStatus||{};
   localStorage.setItem('sriHariV1',JSON.stringify(S));
  }else{
   await v6Ref.set(v6Payload());
  }
  if(!v6Listening){
   v6Listening=true;
   v6Ref.on('value',snap=>{
    if(v6Writing||!sriHariUser)return;
    const d=snap.val();
    if(!d||!Array.isArray(d.records))return;
    S.records=d.records||[];
    S.tech=Array.isArray(d.tech)&&d.tech.length?d.tech:S.tech;
    S.reminders=d.reminders||[];
    S.reminderStatus=d.reminderStatus||{};
    S.firebase.lastSync=new Date().toISOString();
    localStorage.setItem('sriHariV1',JSON.stringify(S));
    if(S.page!=='settings')render();
    v6SetStatus('Connected • Realtime sync active',true)
   })
  }
  S.firebase.enabled=true;S.firebase.connected=true;S.firebase.lastSync=new Date().toISOString();
  v6SetStatus('Connected • Realtime sync active',true);
  if(S.page!=='settings')render();
 }catch(e){
  S.firebase.connected=false;
  v6SetStatus('Database connection failed: '+(e.message||e));
  console.error(e);
 }
}

  await firebase.auth().signInWithEmailAndPassword(email,password);

  if(err)err.textContent=secureFriendlyAuthError(e);
 }finally{

async function secureForgotPassword(){
 const email=($("loginEmail")?.value||"").trim();
 const err=$("authError");
 if(!email){if(err)err.textContent="Enter your email first.";return}
 try{
  if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
  await firebase.auth().sendPasswordResetEmail(email);
  if(err)err.textContent="Password reset email sent. Check your inbox.";
 }catch(e){if(err)err.textContent=secureFriendlyAuthError(e)}
}

async function v2SendPDF(r){

   text("50-1, Venkatesha Nagar,",L,y,8); y+=4;
   text("Kumbakonam",L,y,8); y+=4;
   text("6382212457",L,y,8); y+=3;
   doc.setFillColor(23,63,145);doc.rect(L,y,W,1,"F");y+=7;

   text("Mobile No.",L+4,panelY+21,8);text(": "+(r.mobile||"—"),L+38,panelY+21,8,true);
   const VX=L+panelW+gap;
   text("VEHICLE & SERVICE DETAILS",VX+4,panelY+6,9,true);
   text("Vehicle Number",VX+4,panelY+12,7.5);text(": "+(r.vehicle||"—"),VX+39,panelY+12,7.5,true);

   // Service table
   const cols=[L,L+10,L+103,L+128,L+156,R];

   ["S.NO","SERVICE / ITEM DESCRIPTION","QTY","RATE (Rs.)","AMOUNT (Rs.)"].forEach((t,i)=>text(t,(cols[i]+cols[i+1])/2,y+4.7,7.2,true,{align:"center"}));
   y+=7;

   (r.items||[]).forEach((it,n)=>{
     ensure(8);
     doc.setDrawColor(201,210,223);doc.rect(L,y,W,8,"S");

   y+=5;ensure(40);

   y=lowerY+lowerH+8;

   if(r.type==="Wheel Alignment Service"&&r.km){

     doc.setFillColor(23,63,145);doc.rect(L,y,W,7,"F");text("NEXT SERVICE SCHEDULE",L+W/2,y+4.8,9,true,{align:"center"});y+=7;
    if(r.type==="Free Service"){ text("FREE SERVICE COMPLETED",L,y,9,true); y+=7; }
     doc.roundedRect(L,y,W,25,2,2,"S");
     const mid=L+W/2;

     text((Number(r.km)+2000).toLocaleString("en-IN")+" KM",L+W/4,y+14,13,true,{align:"center"});
     text("OR within 2 months, whichever comes first.",L+W/4,y+20,7.5,false,{align:"center"});
     text("NEXT PAID WHEEL ALIGNMENT SERVICE",mid+W/4,y+7,8,true,{align:"center"});
     text((Number(r.km)+5000).toLocaleString("en-IN")+" KM",mid+W/4,y+14,13,true,{align:"center"});
     y+=25;
     doc.setFillColor(255,242,189);doc.rect(L,y,W,7,"F");text("Note: Please bring this Service Record during your next visit.",L+W/2,y+4.8,7.5,true,{align:"center"});y+=12;
   }
   ensure(18);doc.setDrawColor(201,210,223);doc.line(L,y,R,y);y+=7;
   y+=4;
   text("____________________________",R,y,8,false,{align:"right"});
   text("For SRI HARI TYRES",R,y+5,8,true,{align:"right"});
   text("(Authorised Signatory)",R,y+10,7.5,false,{align:"right"});
   y+=16;

   const blob=doc.output("blob");
   const file=new File([blob],`Service_Record_${r.no}.pdf`,{type:"application/pdf"});
   if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
     await navigator.share({title:`Sri Hari Tyres Service Record ${r.no}`,text:"Service Record PDF",files:[file]});
   }else{
     const u=URL.createObjectURL(blob),a=document.createElement("a");
     a.href=u;a.download=`Service_Record_${r.no}.pdf`;document.body.appendChild(a);a.click();a.remove();
     setTimeout(()=>URL.revokeObjectURL(u),1200);
   }
 }catch(e){

 }
}
